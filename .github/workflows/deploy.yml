name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install ImageMagick
        run: sudo apt update && sudo apt install imagemagick -y

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Install RenderCV
        run: pip install rendercv[full]

      - name: Render CV
        run: rendercv render _data/cv.yml --settings assets/yaml/settings.yaml

      - name: Generate Publications PDF
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            mkdir -p assets/pdf
            cd assets/tex
            sed -e '/^---/d' -e 's/<em>/\\textit{/g' -e 's/<\/em>/}/g' ../../_bibliography/papers.bib > papers.bib
            pdflatex -interaction=nonstopmode jira_publications.tex
            biber jira_publications
            pdflatex -interaction=nonstopmode jira_publications.tex
            pdflatex -interaction=nonstopmode jira_publications.tex
            cp jira_publications.pdf ../pdf/jira_publications.pdf
            cd ../..

      - name: Configure the Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the Site
        run: JEKYLL_ENV=production && bundle exec jekyll build

      - name: Upload the Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      url: ${{ steps.deployment.outputs.page_url }}
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
