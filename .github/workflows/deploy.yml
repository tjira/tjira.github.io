name: Deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install ImageMagick
        run: sudo apt update && sudo apt install imagemagick -y

      - name: Configure the Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the Site
        run: JEKYLL_ENV=production && bundle exec jekyll build --baseurl "${{ steps.pages.base_path }}"

      - name: Upload the Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      url: ${{ steps.deployment.outputs.page_url }}
      name: docs

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
