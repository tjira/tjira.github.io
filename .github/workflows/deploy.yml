name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repository
        uses: actions/checkout@v7

      - name: Install ImageMagick
        run: sudo apt update && sudo apt install imagemagick -y

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install RenderCV
        run: pip install rendercv[full]

      - name: Render CV
        run: rendercv render _data/cv.yml --pdf-path ../assets/pdf/tomas_jira_cv.pdf --settings assets/rendercv/settings.yaml --typst-path ../assets/typ/tomas_jira_cv.typ

      - name: Configure the Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the Site
        run: JEKYLL_ENV=production && bundle exec jekyll build --baseurl "${{ steps.pages.base_path }}"

      - name: Upload the Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      url: ${{ steps.deployment.outputs.page_url }}
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
